# Aurora OS boot configuration
#
# Fichero opcional. Si no existe en el ESP (/etc/aurora.conf), el
# bootloader usa el kernel por defecto: \kernel.elf
#
# Formato: key=value, un par por línea.
#   - Comentarios con '#' al inicio de línea.
#   - Whitespace al inicio/fin de línea y de valor se recorta.
#   - Rutas estilo UEFI (backslash como separador, o slash que se
#     normaliza a backslash).
#   - Si la ruta no empieza por '\', el bootloader la prefija.
#   - Claves desconocidas se ignoran (permite ampliar el formato).

# Ruta del kernel dentro del ESP.
# Ejemplos:
#   kernel=\kernel.elf
#   kernel=\boot\kernel.elf
kernel=\kernel.elf

# Linea de comandos del kernel (opciones separadas por espacios). La pasan
# los dos bootloaders (UEFI y BIOS) en kernel_boot_info.cmdline.
# Opciones que entiende el kernel:
#   aur.skip=VVVV:DDDD[,VVVV:DDDD...]  aur_bus no lanza el .aur de esos
#       dispositivos PCI (DDDD puede ser '*'); quedan libres para un driver
#       del kernel, p. ej. uno de Linux sobre la capa LinuxKPI. Ejemplo (bochs
#       y virtio-gpu de Linux en vez de los .aur):
#         cmdline=aur.skip=1234:1111,1af4:1050

# Reservado para futuro:
# timeout=3
# default=aurora
# initrd=\boot\initrd.tar