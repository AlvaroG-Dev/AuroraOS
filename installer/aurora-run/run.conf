# /etc/aurora/run.conf — reglas de aurora-run, el lanzador de AuroraOS.
#
# aurora-run abre cada programa segun lo que es: app de Aurora (tal cual),
# app Linux (tal cual, con el entorno del escritorio) o app Windows (Wine).
# Aqui se puede forzar otra cosa para un programa concreto. Una regla por
# linea:   <patron>   <aurora|linux|windows|vm>
# El patron (glob, como en la shell) se compara con la ruta completa y con el
# nombre del fichero (este sin distinguir mayusculas). Gana la primera regla;
# las de ~/.config/aurora/run.conf van antes que estas.
#
# "vm" es la mini-VM de Aurora para programas que Wine no abre bien (todavia
# no existe: aurora-run avisa). Ejemplos:
#
#   /opt/juegos/*.exe        windows
#   AntiCheatGame.exe        vm
#   /home/*/bin/herramienta  linux
