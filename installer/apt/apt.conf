// Configuracion de APT de AuroraOS. Todo el estado vive en /usr/lib/aurora-apt
// (persistente en el ext2 instalado; /etc, /var y /tmp son tmpfs).
Dir "/";
Dir::Etc "/usr/lib/aurora-apt/etc";
Dir::Etc::sourcelist "/usr/lib/aurora-apt/etc/sources.list";
Dir::Etc::sourceparts "/usr/lib/aurora-apt/etc/sources.list.d";
Dir::Etc::parts "/usr/lib/aurora-apt/etc/apt.conf.d";
Dir::Etc::preferencesparts "/usr/lib/aurora-apt/etc/preferences.d";
Dir::Etc::trusted "/usr/share/keyrings/ubuntu-archive-keyring.gpg";
Dir::Etc::trustedparts "/usr/lib/aurora-apt/etc/trusted.gpg.d";
Dir::State "/usr/lib/aurora-apt/state";
Dir::State::status "/usr/lib/aurora-apt/dpkg/status";
Dir::Cache "/usr/lib/aurora-apt/cache";
Dir::Log "/run/aurora-apt";
Dir::Bin::dpkg "/usr/bin/dpkg";
Dir::Bin::methods "/usr/lib/apt/methods";
APT::Sandbox::User "";
APT::Architecture "amd64";
APT::Install-Recommends "false";
APT::Install-Suggests "false";
Acquire::Languages "none";
Acquire::Retries "2";
Acquire::http::Timeout "30";
DPkg::Options { "--admindir=/usr/lib/aurora-apt/dpkg"; "--force-unsafe-io"; "--force-depends-version"; };
DPkg::Pre-Install-Pkgs "";
DPkg::Post-Invoke "";
// Una sola conexion HTTP a la vez: la pila TCP de Aurora aun no aguanta bien varias en paralelo.
Acquire::Queue-Mode "access";
Acquire::http::Pipeline-Depth "0";
