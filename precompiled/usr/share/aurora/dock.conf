# Lanzadores fijados en el Dock de Aurora (apps Linux / Wayland).
#   Nombre | app_id | simbolo | color RRGGBB | icono BMP | orden de arranque (ruta args...)
# El app_id es el que declara la app con xdg_toplevel.set_app_id: las ventanas
# con ese app_id cuelgan del icono fijado en vez de crear uno nuevo. El icono es
# un BMP 32 bpp con alfa del VFS (assets/system/icons/, ver
# scripts/gen-dock-icons.py); si falta, el Dock dibuja una baldosa con el simbolo
# y el color.
Foot|foot|>_|3A3A3C|/system/icons/app-foot.bmp|/usr/bin/foot
Terminal Weston|org.freedesktop.weston.wayland-terminal|wt|3C4860|/system/icons/app-weston-terminal.bmp|/usr/bin/weston-terminal
Flower|org.freedesktop.weston.flower|Fl|D6286B|/system/icons/app-flower.bmp|/usr/bin/weston-flower
Clickdot|org.freedesktop.weston.clickdot|Cd|1A9642|/system/icons/app-clickdot.bmp|/usr/bin/weston-clickdot
