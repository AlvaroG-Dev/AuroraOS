# Reglas para clientes Wayland que dibujan su propia decoracion (CSD) y no
# negocian xdg-decoration. aurora-wayland recorta esa barra/bordes para que la
# unica decoracion visible sea la de Aurora.
#
#   patron  [top=N] [left=N] [right=N] [bottom=N] [border=N]
#
# `patron` es un glob sobre el app_id o el nombre del proceso. Solo se aplica si
# el cliente muestra margenes de CSD (set_window_geometry menor que el buffer).
# Un patron sin valores (o con 0) deja la app sin recorte. Las reglas de este
# fichero tienen prioridad sobre las predeterminadas (weston-*: top=27 border=6).
#
# Ejemplos:
#   org.example.App   top=37
#   miapp-*           top=30 border=1
