name: boot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  qemu-smoke-test:
    name: Arrancar en QEMU y verificar serial
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm xorriso mtools \
            qemu-system-x86 ovmf gnu-efi

      - name: Compilar ISO
        run: make iso

      - name: Verificar OVMF
        run: |
          ls -l /usr/share/OVMF/OVMF_CODE_4M.fd
          ls -l /usr/share/OVMF/OVMF_VARS_4M.fd

      - name: Arrancar en QEMU (TCG, single-CPU)
        env:
          USE_KVM: no
          QEMU_SMP: 1
          REQUIRE_SMP: no
          TIMEOUT: 60
          # Mostrar las últimas 200 líneas del serial en el log del job.
          # El log completo queda como artefacto (ver step siguiente).
          SHOW_SERIAL: yes
          SHOW_SERIAL_LINES: 500
        run: |
          chmod +x scripts/check_boot.sh
          ./scripts/check_boot.sh

      - name: Subir serial.log SIEMPRE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: serial.log
          if-no-files-found: warn
          retention-days: 14

      - name: Subir qemu.log SIEMPRE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log
          path: qemu.log
          if-no-files-found: warn
          retention-days: 14
