name: boot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  qemu-smoke-test:
    name: Arrancar en QEMU (${{ matrix.smp }} CPU)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        smp: [1, 2, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm xorriso mtools \
            qemu-system-x86 ovmf gnu-efi

      - name: Compilar ISO
        run: make iso

      - name: Verificar OVMF
        run: |
          ls -l /usr/share/OVMF/OVMF_CODE_4M.fd
          ls -l /usr/share/OVMF/OVMF_VARS_4M.fd

      - name: Arrancar en QEMU (TCG, ${{ matrix.smp }} CPU)
        env:
          USE_KVM: no
          QEMU_SMP: ${{ matrix.smp }}
          REQUIRE_SMP: ${{ matrix.smp == 1 && 'no' || 'yes' }}
          TIMEOUT: 30
          SHOW_SERIAL: yes
          SHOW_SERIAL_LINES: 500
        run: |
          chmod +x scripts/check_boot.sh
          ./scripts/check_boot.sh

      - name: Subir serial.log SIEMPRE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log-${{ matrix.smp }}cpu
          path: serial.log
          if-no-files-found: warn
          retention-days: 14

      - name: Subir qemu.log SIEMPRE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log-${{ matrix.smp }}cpu
          path: qemu.log
          if-no-files-found: warn
          retention-days: 14
