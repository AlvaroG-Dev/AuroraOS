# /etc/mke2fs.conf de Aurora OS: ext2 con lo que el kernel sabe escribir.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384
	enable_periodic_fsck = 0

[fs_types]
	ext2 = {
		features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	}
	small = {
		blocksize = 1024
		inode_ratio = 4096
	}
	floppy = {
		blocksize = 1024
		inode_ratio = 8192
	}
